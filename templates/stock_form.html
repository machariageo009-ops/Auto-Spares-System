{% extends "base.html" %}
{% block title %}Add Stock{% endblock %}

{% block content %}
<h1>Record a stock purchase</h1>

<form method="post" class="card">
    <label for="part_id">Select product</label>
    <select name="part_id" id="part_id" required>
        <option value="">Choose a product</option>
        {% for part in parts %}
        <option value="{{ part['id'] }}">
            {{ part['name'] }} {{ part['engine'] or '' }} {{ part['specification'] or '' }}
            (current stock: {{ part['stock_quantity'] }})
        </option>
        {% endfor %}
    </select>

    <div class="two">
        <div>
            <label for="quantity">Quantity purchased</label>
            <input type="number" name="quantity" id="quantity" min="1" step="1" required>
        </div>
        <div>
            <label for="unit_cost">Buying price per unit (KSh)</label>
            <input type="number" name="unit_cost" id="unit_cost" min="0" step="0.01" required>
        </div>
    </div>

    <label for="purchase_date">Purchase date</label>
    <input type="date" name="purchase_date" id="purchase_date" value="{{ today }}" required>

    <label for="supplier_id">Choose an existing supplier (optional)</label>
    <select name="supplier_id" id="supplier_id">
        <option value="">Choose supplier or enter details below</option>
        {% for supplier in suppliers %}
        <option value="{{ supplier['id'] }}">
            {{ supplier['name'] }} - {{ supplier['phone'] }}
        </option>
        {% endfor %}
    </select>

    <p class="mute">If the supplier is not listed above, enter their details below.</p>

    <label for="supplier_name">Supplier name</label>
    <input type="text" name="supplier_name" id="supplier_name" placeholder="Supplier or company name">

    <label for="supplier_phone">Supplier phone number</label>
    <input type="tel" name="supplier_phone" id="supplier_phone" placeholder="e.g. 07XX XXX XXX">

    <label for="reference">Invoice / receipt number (optional)</label>
    <input type="text" name="reference" id="reference" placeholder="Purchase invoice or receipt number">

    <div class="row" style="margin-top:16px; gap:8px; flex-wrap:wrap">
        <button class="btn" type="submit">Save purchase and add stock</button>
        <a class="btn" href="{{ url_for('data', query='stock_purchases') }}">View purchase history</a>
    </div>
</form>
{% endblock %}
